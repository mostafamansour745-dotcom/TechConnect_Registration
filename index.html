<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechConnect 2025 — Registration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">
    <div class="card">

      <div class="card-header">
        <h1>TechConnect 2025</h1>
        <p>Register your attendance for the virtual event</p>
      </div>

      <form id="registrationForm" novalidate>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Ahmed Ali" />
          <span class="error-msg" id="nameError">Name is required.</span>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="ahmed@example.com" />
          <span class="error-msg" id="emailError">Please enter a valid email.</span>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="+20 10 1234 5678" />
          <span class="error-msg" id="phoneError">Phone number is required.</span>
        </div>

        <div class="form-group">
          <label>Gender</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="gender" value="male" /> Male
            </label>
            <label class="radio-option">
              <input type="radio" name="gender" value="female" /> Female
            </label>
          </div>
          <span class="error-msg" id="genderError">Please select your gender.</span>
        </div>

        <div class="form-group">
          <label for="session">Session</label>
          <select id="session">
            <option value="">-- Select a session --</option>
            <option value="Building Modern Web APIs">Building Modern Web APIs</option>
            <option value="Introduction to Cloud Computing">Introduction to Cloud Computing</option>
            <option value="Clean Code and Best Practices">Clean Code and Best Practices</option>
          </select>
          <span class="error-msg" id="sessionError">Please select a session.</span>
        </div>

        <button type="submit" id="submitBtn">
          <span id="btnText">Register Now</span>
          <span id="btnLoader" class="loader hidden"></span>
        </button>

      </form>

      <div id="successMsg" class="alert alert-success hidden">
        ✅ Registration submitted successfully!<br />
        <span id="registrationId"></span>
      </div>

      <div id="errorMsg" class="alert alert-error hidden">
        ❌ <span id="errorText"></span>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
